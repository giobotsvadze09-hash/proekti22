<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Account - Foodie</title>
    <link rel="stylesheet" href="style.css"> <!-- Me style sheet name tho marchukondi -->
</head>
<body>

    <div class="form-container">
        <div class="form-box">
            <h2>Account Verification</h2>
            <p>Please enter the verification code sent to your email.</p>
            
            <form id="verifyForm">
                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" required placeholder="Enter your email">
                </div>

                <div class="input-group">
                    <label for="code">Verification Code</label>
                    <input type="text" id="code" required placeholder="Enter code">
                </div>

                <button type="submit" class="submit-btn">Verify Account</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
